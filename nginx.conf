worker_processes 5;
daemon off;
worker_rlimit_nofile 8192;

events {
  worker_connections 4096;
}

http {
    include    /nix/store/gskmpkvj6gkd8q9bv3sday8clwvkh2nc-e24b4c09e963677b1beea49d411cd315a024ad3a-env/conf/mime.types;
    index    index.html index.htm index.php;
    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log /dev/stdout;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        root /app/public;

        # ✅ ESTA ES LA LÍNEA QUE SOLUCIONA EL ERROR
        client_max_body_size 50M;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /nix/store/gskmpkvj6gkd8q9bv3sday8clwvkh2nc-e24b4c09e963677b1beea49d411cd315a024ad3a-env/conf/fastcgi_params;
            include /nix/store/gskmpkvj6gkd8q9bv3sday8clwvkh2nc-e24b4c09e963677b1beea49d411cd315a024ad3a-env/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
